services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expense_diary
      POSTGRES_USER: expense_diary
      POSTGRES_PASSWORD: expense_diary
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_diary -d expense_diary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
